# Adds new issues and pull requests to the fork's GitHub project
# (https://github.com/users/aaronsb/projects/10), which tracks kmscon and
# libtsm together. A user-owned project can't be written with GITHUB_TOKEN,
# so this uses ADD_TO_PROJECT_PAT, a classic token with the project and repo
# scopes. The plain pull_request trigger never exposes that secret to pull
# requests from forks; those are added by hand. Status, Area and Step are set
# by whoever files the item.
name: Add to project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/aaronsb/projects/10
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
